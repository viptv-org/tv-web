<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>viptv TV SolidTV preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--viptv-color-bg)}#video-layer{position:fixed;inset:0;z-index:0;display:none;background:var(--viptv-color-bg-oled)}#tv-video{display:block;width:100%;height:100%;object-fit:contain}#player-shade{position:fixed;inset:0;z-index:1;display:none;pointer-events:none;background:linear-gradient(to bottom,var(--viptv-color-player-shade),transparent) left top/100% var(--viptv-size-player-shade-top-tv) no-repeat,linear-gradient(to bottom,transparent 0%,var(--viptv-color-player-shade-mid-tv) 45%,var(--viptv-color-player-shade-end-tv) 100%) left bottom/100% var(--viptv-size-player-shade-bottom-tv) no-repeat}#app{position:fixed;inset:0;z-index:2}#solid-preparing-spinner{display:none;position:fixed;z-index:3;left:50%;top:45.8%;width:2.92vw;height:2.92vw;box-sizing:border-box;border:.26vw solid var(--viptv-color-status-spinner-track);border-top-color:var(--viptv-accent);border-radius:50%;transform:translateX(-50%);pointer-events:none;animation:solid-preparing-spin 1s linear infinite}@keyframes solid-preparing-spin{to{transform:translateX(-50%) rotate(360deg)}}@media (prefers-reduced-motion:reduce){#solid-preparing-spinner{animation-duration:3s}}</style></head><body><div id="video-layer"><video id="tv-video" class="video" playsinline preload="auto"></video></div><div id="player-shade"></div><div id="app"></div><div id="solid-preparing-spinner" aria-hidden="true"></div><script type="module" src="/src/tv-solid/main.ts"></script></body></html>
