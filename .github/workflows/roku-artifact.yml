name: Build beta Roku ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roku-artifact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  roku:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: roku/package.json
          run_install: false
      - run: npm ci
      - name: Install frozen native dependencies
        working-directory: roku
        run: pnpm install --frozen-lockfile
      - name: Check shared source integrity and native tests
        run: |
          npm run design:check
          npm run artwork:check
          npm run core:check
          npm run video:check
          npm run test:native
      - name: Build native release without device access
        working-directory: roku
        run: pnpm exec rk build --local --release --no-source-map --out-dir dist-roku
      - name: Verify and package beta developer ZIP
        run: python3 scripts/package-roku.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roku-beta-${{ github.sha }}
          path: artifacts/roku/*
          if-no-files-found: error
          retention-days: 30
