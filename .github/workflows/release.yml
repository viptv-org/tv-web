name: Publish reviewed TV candidates
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (v0.1.0 etc.)
        required: true
permissions:
  contents: write
concurrency:
  group: tv-release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run package:tv
      - name: Prepare draft candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "viptv TV candidate $RELEASE_TAG" --notes "Hosted Vizio bundle and unsigned Samsung launcher. Physical TV acceptance and Samsung signing remain required. No automatic production deployment." artifacts/tizen-candidate/*/*.wgt artifacts/vizio-hosting/*/*.zip
