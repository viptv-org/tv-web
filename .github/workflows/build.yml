name: Build TV packages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auth_recovery_ui:
        description: Run focused startup authentication recovery browser checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tv-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hosting:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: roku/package.json
          run_install: false
      - run: npm ci
      - name: Install Roku lockfile dependencies
        working-directory: roku
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run build
      - name: Qualify startup authority recovery over disposable HTTPS
        if: github.event_name == 'workflow_dispatch' && inputs.auth_recovery_ui
        timeout-minutes: 8
        run: |
          npx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/auth-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=127.0.0.1 -keyout "$RUNNER_TEMP/auth-tls/viptv.local.test.key" -out "$RUNNER_TEMP/auth-tls/viptv.local.test.crt"
          ln -s "$GITHUB_WORKSPACE/design-contract" "$GITHUB_WORKSPACE/../design"
          node tests/preview/https-static.mjs "$RUNNER_TEMP/auth-tls" 18562 > "$RUNNER_TEMP/auth-server.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --insecure --silent --fail https://127.0.0.1:18562/tv/solid.html >/dev/null && break; sleep 1; done
          npx playwright test --config playwright.auth-recovery.config.ts --reporter=line
      - run: node scripts/package-tv.mjs hosting
      - uses: actions/upload-artifact@v4
        with:
          name: tv-hosting-${{ github.sha }}
          path: artifacts/hosting/*
          if-no-files-found: error
          retention-days: 30
  webos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @webos-tools/cli@3.2.6
      - run: node scripts/package-tv.mjs webos
      - uses: actions/upload-artifact@v4
        with:
          name: lg-webos22-${{ github.sha }}
          path: artifacts/webos/*
          if-no-files-found: error
          retention-days: 30
  tizen:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VIPTV_TIZEN_API_ORIGIN: https://viptv.syek.tech
      TIZEN_AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
      TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
      TIZEN_DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
      TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Samsung certificates
        run: |
          python3 - <<'PY'
          import os
          missing=[n for n in ['TIZEN_AUTHOR_P12','TIZEN_AUTHOR_PASSWORD','TIZEN_DISTRIBUTOR_P12','TIZEN_DISTRIBUTOR_PASSWORD'] if not os.environ.get(n)]
          if missing: raise SystemExit('Configure Samsung signing secrets: '+', '.join(missing))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build -- --base=./
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Tizen CLI
        run: |
          curl --fail --location --retry 3 https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin -o "$RUNNER_TEMP/tizen-cli.bin"
          chmod +x "$RUNNER_TEMP/tizen-cli.bin"
          "$RUNNER_TEMP/tizen-cli.bin" --accept-license "$RUNNER_TEMP/tizen-studio"
          echo "$RUNNER_TEMP/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/tizen-signing.py
      - run: node scripts/package-tv.mjs tizen
        env:
          TIZEN_PROFILE: viptv
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-tizen-signed-${{ github.sha }}
          path: artifacts/tizen/*
          if-no-files-found: error
          retention-days: 30
