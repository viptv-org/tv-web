<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>viptv TV SolidTV preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--viptv-color-bg)}#video-layer{position:fixed;inset:0;z-index:0;display:none;background:var(--viptv-color-bg-oled)}#tv-video{display:block;width:100%;height:100%;object-fit:contain}#player-shade{position:fixed;inset:0;z-index:1;display:none;pointer-events:none;background:linear-gradient(to bottom,var(--viptv-color-player-shade),transparent) left top/100% var(--viptv-size-player-shade-top-tv) no-repeat,linear-gradient(to bottom,transparent 0%,var(--viptv-color-player-shade-mid-tv) 45%,var(--viptv-color-player-shade-end-tv) 100%) left bottom/100% var(--viptv-size-player-shade-bottom-tv) no-repeat}#app{position:fixed;inset:0;z-index:2}</style></head><body><div id="video-layer"><video id="tv-video" class="video" playsinline preload="auto"></video></div><div id="player-shade"></div><div id="app"></div><script type="module" src="/src/tv-solid/main.ts"></script></body></html>
